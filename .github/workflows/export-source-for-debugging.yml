name: Debug source snapshot
on:
  push:
    branches: [feature/townlife-workstations-breaks]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive checked-out sources
        run: tar --exclude=.git -czf "$RUNNER_TEMP/season2-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: season2-source-snapshot
          path: ${{ runner.temp }}/season2-source.tar.gz
          retention-days: 1