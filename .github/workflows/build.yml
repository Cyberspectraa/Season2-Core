name: Forge build

on:
  push:
    branches: [ main, forgegradle-srg-migration ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Verify repository source tree
        shell: bash
        run: |
          set -e
          JAVA_COUNT=$(find src/main/java -type f -name '*.java' 2>/dev/null | wc -l)
          RESOURCE_COUNT=$(find src/main/resources -type f 2>/dev/null | wc -l)
          echo "Java source files: $JAVA_COUNT"
          echo "Resource files: $RESOURCE_COUNT"
          if [ "$JAVA_COUNT" -eq 0 ]; then
            echo "::error::src/main/java is missing or contains no Java source files."
            exit 1
          fi
          if [ "$RESOURCE_COUNT" -eq 0 ]; then
            echo "::error::src/main/resources is missing or contains no resource files."
            exit 1
          fi

      - name: Verify Java
        run: java -version

      - name: Convert legacy SRG identifiers to Mojang mappings
        run: python scripts/migrate_srg_to_mojang.py src/main/java

      - name: Report SRG identifiers still present in Java code
        run: python scripts/check_legacy_srg.py src/main/java || true

      - name: Build
        run: gradle --no-daemon build

      - name: Upload mapped source preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapped-source-preview
          if-no-files-found: error
          path: |
            src/main/java
            build/srg-migration-report.json
