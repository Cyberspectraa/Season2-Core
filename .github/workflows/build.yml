name: Forge build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify Java
        run: java -version
      - name: Report remaining legacy SRG names
        run: python scripts/check_legacy_srg.py src/main/java || true
      - name: Build
        run: gradle --no-daemon build
