name: Forge build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Apply and commit staged Town Life implementation
        if: ${{ hashFiles('scripts/townlife-feature.patch.xz.b64') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/townlife-feature.patch.xz.b64 | xz -d > /tmp/townlife-feature.patch
          git apply --check /tmp/townlife-feature.patch
          git apply /tmp/townlife-feature.patch
          javac -d /tmp/townlife-break-test src/main/java/com/season2/townlife/logic/BreakSchedule.java src/test/java/com/season2/townlife/logic/BreakScheduleTest.java
          java -ea -cp /tmp/townlife-break-test com.season2.townlife.logic.BreakScheduleTest
          git add src
          git rm scripts/townlife-feature.patch.xz.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add Town Life assigned work squares and midshift breaks'
          git push origin HEAD:feature/townlife-workstations-breaks

      - name: Verify repository source tree
        shell: bash
        run: |
          set -e
          JAVA_COUNT=$(find src/main/java -type f -name '*.java' 2>/dev/null | wc -l)
          RESOURCE_COUNT=$(find src/main/resources -type f 2>/dev/null | wc -l)
          echo "Java source files: $JAVA_COUNT"
          echo "Resource files: $RESOURCE_COUNT"
          test "$JAVA_COUNT" -gt 0
          test "$RESOURCE_COUNT" -gt 0

      - name: Verify committed Mojang-mapped source
        run: python scripts/check_legacy_srg.py src/main/java

      - name: Build Forge JAR
        run: gradle --no-daemon build

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: season2-core-build
          if-no-files-found: error
          path: build/libs/*.jar
