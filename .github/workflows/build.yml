name: Forge build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Verify repository source tree
        shell: bash
        run: |
          set -e
          JAVA_COUNT=$(find src/main/java -type f -name '*.java' 2>/dev/null | wc -l)
          RESOURCE_COUNT=$(find src/main/resources -type f 2>/dev/null | wc -l)
          echo "Java source files: $JAVA_COUNT"
          echo "Resource files: $RESOURCE_COUNT"
          test "$JAVA_COUNT" -gt 0
          test "$RESOURCE_COUNT" -gt 0

      - name: Verify committed Mojang-mapped source
        run: python scripts/check_legacy_srg.py src/main/java

      - name: Build Forge JAR
        run: gradle --no-daemon build

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: season2-core-build
          if-no-files-found: error
          path: build/libs/*.jar
